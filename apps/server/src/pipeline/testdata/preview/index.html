<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sample preview</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans Hebrew";
        src: url("assets/fonts/noto-sans-hebrew-hebrew-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #cut { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #title {
        position: absolute; left: 80px; right: 80px; top: 320px; opacity: 0;
        font: 700 96px/1.1 "Noto Sans Hebrew", sans-serif; color: #fff; text-align: center;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55); unicode-bidi: plaintext;
      }
      #badge-host { position: absolute; inset: 0; z-index: 5; }
      #progress {
        position: absolute; left: 0; bottom: 0; width: 100%; height: 24px;
        background: #ffd60a; transform-origin: 0 50%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="6">
      <video id="cut" class="clip" src="cut.mp4" playsinline data-start="0" data-duration="6" data-track-index="0" data-has-audio="true"></video>
      <div id="title" dir="auto">Sample preview</div>
      <div id="badge-host" data-composition-id="badge" data-composition-src="compositions/badge.html" data-start="2" data-duration="3" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="progress"></div>
    </div>
    <script>
      (() => {
        // The bare <hyperframes-player> loads the HyperFrames runtime only after this script has
        // run, so the timeline registry must exist already (`hyperframes preview` creates it first).
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#title", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
        tl.to("#title", { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, 4.8);
        tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: 6, ease: "none" }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
