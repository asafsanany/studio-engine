<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the phone layout reach under the notch and the home indicator; its
         safe-area insets (index.css) keep the content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Studio Engine</title>

    <!-- Dark from the first frame: before the stylesheet arrives, and behind the Home Screen app. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090B" />
    <style>
      html {
        background-color: #09090b;
        color-scheme: dark;
      }
    </style>

    <!-- The Home Screen app: opens without Safari around it, under a translucent status bar. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Studio Engine" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The page's own safety net (CVP-317), plain HTML and script because it must work when the
         app's script or stylesheet never arrives (a file lost on a weak connection, a Mac that is
         asleep, an old page asking for files a newer release replaced).
         - After 6 s with nothing drawn in #root it shows "Connecting...", asks the engine every 5 s
           and reloads the page as soon as the engine answers (3 times at most per tab session, then
           the Reload button is all that is left). It goes away by itself if the app starts.
         - A script or stylesheet that cannot be fetched (vite:preloadError, a chunk-load error)
           reloads the page once a minute at most.
         Tested in src/features/recovery/boot-watchdog.test.ts, which runs this very script. -->
    <div
      id="boot-connecting"
      role="alert"
      style="position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; font: 14px/1.43 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fafafa; background: #09090b"
    >
      <p style="margin: 0; font-size: 16px; font-weight: 600">Connecting&hellip;</p>
      <p style="margin: 0; color: #a1a1aa">
        Studio Engine is taking longer than usual to open. Check that the Mac is awake and that
        Tailscale is on.
      </p>
      <button
        type="button"
        onclick="location.reload()"
        style="margin-top: 8px; height: 44px; padding: 0 20px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; background: rgba(255, 255, 255, 0.05); color: #fafafa; font: inherit; font-weight: 500; cursor: pointer"
      >
        Reload
      </button>
    </div>
    <script>
      (() => {
        const SHOW_MS = 6000;
        const POLL_MS = 5000;
        const MAX_AUTO_RELOADS = 3;
        const GUARD_MS = 60000;
        const CHUNK_KEY = 'studio.boot.chunk.v1';
        const RETRY_KEY = 'studio.boot.retries.v1';
        const CHUNK_ERROR =
          /Loading chunk|Loading CSS chunk|Failed to fetch dynamically imported module|error loading dynamically imported module|Importing a module script failed|Unable to preload CSS/i;

        const root = document.getElementById('root');
        const screen = document.getElementById('boot-connecting');
        const started = () => root.childElementCount > 0;
        const read = (key) => {
          try {
            return sessionStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const write = (key, value) => {
          try {
            sessionStorage.setItem(key, value);
          } catch {}
        };

        // A file that cannot be fetched: reload once (not again within a minute).
        const reloadOnce = () => {
          const last = Number(read(CHUNK_KEY));
          if (last > 0 && Date.now() - last < GUARD_MS) return;
          write(CHUNK_KEY, String(Date.now()));
          location.reload();
        };
        window.addEventListener('vite:preloadError', (event) => {
          event.preventDefault();
          reloadOnce();
        });
        window.addEventListener('error', (event) => {
          if (CHUNK_ERROR.test(String(event.message))) reloadOnce();
        });
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          if (CHUNK_ERROR.test(String(reason?.message ?? reason)))
            reloadOnce();
        });

        // Nothing drawn after SHOW_MS: say so, and reload when the engine answers.
        let poll = null;
        const stop = () => {
          if (poll !== null) clearInterval(poll);
          poll = null;
          screen.style.display = 'none';
        };
        new MutationObserver(() => {
          if (started()) {
            stop();
            write(RETRY_KEY, '0');
          }
        }).observe(root, { childList: true });
        setTimeout(() => {
          if (started()) return;
          screen.style.display = 'flex';
          poll = setInterval(async () => {
            if (started()) return stop();
            const retries = Number(read(RETRY_KEY)) || 0;
            if (retries >= MAX_AUTO_RELOADS) return;
            try {
              const response = await fetch('/api/health', { cache: 'no-store' });
              if (!response.ok || started()) return;
            } catch {
              return;
            }
            write(RETRY_KEY, String(retries + 1));
            location.reload();
          }, POLL_MS);
        }, SHOW_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
